name: "Swappiness Tuner"
version: "1.0.4"
slug: "ha_swappiness_tuner"
description: "Ajusta vm.swappiness en cada arranque, porque Home Assistant OS lo trae fijo en 1 y no lo expone en ninguna parte."
url: "https://github.com/patriciorangles/ha-addons-repo/tree/main/ha-swappiness-tuner"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: services
boot: "auto"
init: false
privileged:
  - SYS_ADMIN
apparmor: false
options:
  swappiness: 60
schema:
  swappiness: "int(0,100)"
