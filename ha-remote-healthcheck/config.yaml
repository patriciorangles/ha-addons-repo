name: "Remote Healthcheck"
version: "1.0.0"
slug: "ha_remote_healthcheck"
description: "Revisa periódicamente si Home Assistant es accesible desde internet (no solo en la red local) y, si detecta caídas prolongadas, reinicia automáticamente el add-on responsable (ej. Cloudflared) y notifica por push."
url: "https://github.com/<tu-usuario>/ha-addons-repo/tree/main/ha-remote-healthcheck"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: services
boot: auto
init: false
hassio_api: true
homeassistant_api: true
options:
  public_url: "https://cambia-esto.example.com/"
  check_interval_seconds: 300
  timeout_seconds: 15
  fails_before_restart: 3
  fails_before_escalate: 6
  restart_addon_slug: "9074a9fa_cloudflared"
  notify_targets:
    - "mobile_app_example"
schema:
  public_url: "url"
  check_interval_seconds: "int(30,3600)"
  timeout_seconds: "int(3,60)"
  fails_before_restart: "int(1,20)"
  fails_before_escalate: "int(1,50)"
  restart_addon_slug: "str"
  notify_targets:
    - "str"
